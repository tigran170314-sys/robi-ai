
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080d17">
<title>Роби — мой помощник</title>
<style>
:root {
  --bg:#080d17;
  --panel:#111c2b;
  --glow:#55dfff;
  --text:#f1f7ff;
  --muted:#9aafc8;
}
* { box-sizing:border-box }
body {
  margin:0;background:var(--bg);color:var(--text);
  font:16px system-ui,sans-serif;
}
header {
  height:66px;position:sticky;top:0;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:#080d17;
  border-bottom:1px solid #203149;
}
.brand { font-size:24px;font-weight:850;letter-spacing:3px }
button {
  cursor:pointer;padding:11px 14px;border-radius:12px;
  color:var(--text);background:#142a40;
  border:1px solid #29445e;
}
button:hover { border-color:var(--glow) }
.icon { font-size:22px;color:var(--glow) }
main { max-width:800px;margin:auto;padding:22px 15px 60px }
h1 { font-size:28px }
h2 { font-size:23px }
.card {
  padding:17px;margin:12px 0;border-radius:17px;
  background:var(--panel);border:1px solid #203149;
}
.muted { color:var(--muted);font-size:14px;line-height:1.6 }
.primary { width:100%;background:#12344b;border-color:var(--glow) }
input,textarea,select {
  width:100%;padding:12px;margin:7px 0 12px;
  background:#091321;color:white;
  border:1px solid #29445e;border-radius:10px;
  font:inherit;
}
textarea { min-height:100px;resize:vertical }
.hidden { display:none!important }
#shade {
  position:fixed;inset:66px 0 0;background:#0009;z-index:11;
}
#menu {
  position:fixed;z-index:12;top:66px;bottom:0;left:0;
  width:min(330px,88vw);overflow:auto;
  background:#0b1321;padding:12px;border-right:1px solid #294059;
}
.nav { display:block;width:100%;text-align:left;margin:4px 0;background:transparent;border-color:transparent }
.nav.active { background:#142a40;border-color:#29445e }
.nav span { color:var(--glow);display:inline-block;width:30px }
.robot-area { text-align:center;padding:10px 0 25px }
.orb {
  width:min(68vw,270px);aspect-ratio:1;margin:22px auto;
  border-radius:50%;display:grid;place-items:center;
  position:relative;cursor:pointer;
  background:radial-gradient(circle at 28% 20%,#fff,#dcecf9 20%,#91afca 48%,#344e6b 80%,#15283d);
  box-shadow:0 0 25px var(--glow),0 0 70px #55dfff35,inset -15px -18px 28px #07101d;
  animation:float 3s ease-in-out infinite;
}
.orb:before {
  content:"";position:absolute;inset:12%;border-radius:50%;
  border:2px solid var(--glow);box-shadow:0 0 14px var(--glow);
}
.face {
  position:relative;z-index:1;width:66%;height:30%;
  background:#061321;border:2px solid #7899b8;border-radius:30px;
  display:flex;align-items:center;justify-content:space-evenly;
}
.eye {
  width:22%;height:45%;border-radius:20px;
  background:var(--glow);box-shadow:0 0 13px var(--glow);
  animation:blink 4s infinite;
}
.mouth {
  position:absolute;bottom:-35%;width:26%;height:4px;
  border-radius:50%;background:var(--glow);
}
.sleeping .eye { height:3px;animation:none }
.sleeping .mouth { height:3px }
.speaking .mouth { height:13px;animation:talk .2s infinite alternate }
@keyframes float { 50% { transform:translateY(-6px) } }
@keyframes blink {
  0%,43%,47%,85%,100% { transform:scaleY(1) }
  45%,87% { transform:scaleY(.06) }
}
@keyframes talk { to { height:4px;width:18% } }
.chatmsg { padding:12px;margin:8px 0;border-radius:12px;overflow-wrap:anywhere;white-space:pre-wrap }
.user { background:#1b354c;margin-left:12% }
.bot { background:#172332;margin-right:8% }
.item { padding:12px 0;border-bottom:1px solid #28394d }
.swatches { display:flex;gap:12px;flex-wrap:wrap }
.swatch { width:36px;height:36px;border-radius:50%;padding:0 }
.preview { width:100%;height:300px;background:white;border-radius:12px }
footer { text-align:center;padding:20px;color:#627991;font-size:12px }
</style>
</head>
<body>
<header>
  <button class="icon" id="menuBtn" aria-label="Открыть меню">☰</button>
  <div class="brand">РОБИ</div>
  <button class="icon" id="settingsBtn" aria-label="Настройки">⚙</button>
</header>

<div id="shade" class="hidden"></div>
<nav id="menu" class="hidden"></nav>
<main id="app"></main>
<footer>РОБИ · Твой цифровой помощник</footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const pages = [
 ["Главная","⌂"],["Новый чат","＋"],["Голосовой чат","♫"],
 ["История чатов","◷"],["Проекты","▣"],
 ["Создание фото и видео","▧"],["Редактор фото и видео","✎"],
 ["Приложения и доступ","◇"],["Создание сайтов","⌘"],
 ["Настройки Роби","⚙"]
];
function read(k,f=[]){
 try { return JSON.parse(localStorage.getItem("robi."+k)) ?? f }
 catch { return f }
}
function save(k,v){localStorage.setItem("robi."+k,JSON.stringify(v))}
function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c])
}
let page="Главная";
let sleep=false;
let glow=localStorage.getItem("robi.glow")||"#55dfff";
let chats=read("chats");
let projects=read("projects");
let sites=read("sites");
let features=read("features",[
 {id:1,name:"Общение с ИИ",desc:"Диалог с Роби",on:true},
 {id:2,name:"Голосовой чат",desc:"Голосовое управление",on:true},
 {id:3,name:"Анимация робота",desc:"Моргание и сон",on:true}
]);
let commands=read("commands");
let activeChat=null,editFeature=null,editSite=null;

function persist(){
 save("chats",chats);save("projects",projects);
 save("sites",sites);save("features",features);save("commands",commands);
}
function openMenu(show){
 $("#menu").classList.toggle("hidden",!show);
 $("#shade").classList.toggle("hidden",!show);
}
function go(p){page=p;openMenu(false);render()}
function robot(){
 return `<div class="orb ${sleep?"sleeping":""}" id="orb" role="button" tabindex="0" aria-label="Усыпить или разбудить Роби"><div class="face"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div></div>`;
}
function render(){
 document.documentElement.style.setProperty("--glow",glow);
 $("#menu").innerHTML=pages.map(([p,ic])=>
  `<button class="nav ${page===p?"active":""}" data-page="${esc(p)}"><span>${ic}</span>${esc(p)}</button>`
 ).join("");
 const app=$("#app");

 if(page==="Главная"){
  app.innerHTML=`<section class="robot-area">${robot()}<h1>${sleep?"Роби спит":"Привет! Я Роби"}</h1><p class="muted">${sleep?"Нажми на меня, чтобы проснуться":"Я готов помочь. С чего начнём?"}</p><button class="primary" id="newChat">＋ Добавить новый чат</button></section>`;
  $("#orb").onclick=()=>{sleep=!sleep;render()};
  $("#orb").onkeydown=e=>{if(e.key==="Enter"){sleep=!sleep;render()}};
 }
 else if(page==="Настройки Роби"){
  app.innerHTML=`<h2>Настройки Роби</h2>
  <section class="card"><h3>Неоновое свечение</h3><div class="swatches">${["#55dfff","#a88bff","#5ce6ae","#ff80c0","#ffb454"].map(c=>`<button class="swatch" data-color="${c}" style="background:${c}"></button>`).join("")}</div></section>
  <h2>Мои функции</h2><section class="card">${features.map(f=>`<div class="item"><strong>${esc(f.name)}</strong><p class="muted">${esc(f.desc)}</p><button data-toggle="${f.id}">${f.on?"Выключить":"Включить"}</button> <button data-edit="${f.id}">Изменить</button> <button data-del="${f.id}">Удалить</button></div>`).join("")||"Функций нет."}</section>
  <section class="card"><h3>${editFeature?"Изменить функцию":"Добавить функцию"}</h3><form id="featureForm"><input id="fn" placeholder="Название функции" required><textarea id="fd" placeholder="Описание функции" required></textarea><button class="primary">Сохранить</button></form></section>
  <section class="card"><h3>Научи Роби новой команде</h3><form id="commandForm"><textarea id="cmd" placeholder="Какую команду должен освоить Роби?" required></textarea><button class="primary">Сохранить команду</button></form>${commands.map((c,i)=>`<div class="item">${esc(c)} <button data-cmd-del="${i}">Удалить</button></div>`).join("")}</section>`;
  if(editFeature){let f=features.find(x=>x.id===editFeature);if(f){$("#fn").value=f.name;$("#fd").value=f.desc}}
 }
 else if(page==="Новый чат"){
  let c=chats.find(x=>x.id===activeChat);
  if(!c){c={id:String(Date.now()),name:"Новый чат",messages:[]};chats.unshift(c);activeChat=c.id;persist()}
  app.innerHTML=`<h2>${esc(c.name)}</h2><section class="card">${c.messages.map(m=>`<div class="chatmsg ${m.role==="user"?"user":"bot"}"><b>${m.role==="user"?"Ты":"Роби"}</b><div>${esc(m.text)}</div></div>`).join("")||'<p class="muted">Напиши первое сообщение.</p>'}</section><form id="chatForm"><textarea id="msg" placeholder="Сообщение для Роби..." required></textarea><button class="primary">Отправить →</button></form><p class="muted">Для ответов настоящего ИИ необходимо подключить сервер.</p>`;
 }
 else if(page==="История чатов"){
  app.innerHTML=`<h2>История чатов</h2><section class="card">${chats.map(c=>`<div class="item"><button data-open="${c.id}">${esc(c.name)} (${c.messages.length})</button> <button data-chat-del="${c.id}">Удалить</button></div>`).join("")||"История пуста."}</section><button id="newChat" class="primary">＋ Новый чат</button>`;
 }
 else if(page==="Проекты"){
  app.innerHTML=`<h2>Проекты</h2><section class="card"><form id="projectForm"><input id="pn" placeholder="Название проекта" required><button class="primary">Создать</button></form>${projects.map((p,i)=>`<div class="item">${esc(p)} <button data-project-del="${i}">Удалить</button></div>`).join("")}</section>`;
 }
 else if(page==="Создание сайтов"){
  app.innerHTML=`<h2>Создание сайтов</h2><section class="card"><form id="siteForm"><input id="sn" placeholder="Название сайта" required><textarea id="sd" placeholder="Описание сайта"></textarea><button class="primary">Создать проект</button></form></section><section class="card"><h3>Мои сайты</h3>${sites.map((s,i)=>`<div class="item"><b>${esc(s.name)}</b><p>${esc(s.desc)}</p><button data-site-open="${i}">Редактировать</button> <button data-site-del="${i}">Удалить</button></div>`).join("")}</section><section class="card" id="editor"><h3>HTML-редактор</h3><textarea id="code"><!doctype html><html><body><h1>Мой сайт</h1><p>Добро пожаловать!</p></body></html></textarea><button class="primary" id="previewBtn">Предпросмотр</button><iframe class="preview" id="preview" sandbox="allow-forms"></iframe></section>`;
 }
 else if(page==="Приложения и доступ"){
  app.innerHTML=`<h2>Приложения и доступ</h2><section class="card"><h3>Микрофон</h3><p class="muted">Браузер запросит разрешение.</p><button id="mic">Запросить доступ</button><p id="status" class="muted"></p></section><section class="card"><h3>Выбор файлов</h3><p class="muted">Браузер не разрешает сайтам просматривать все установленные приложения телефона.</p><input id="files" type="file" multiple><p id="fileStatus"></p></section>`;
 }
 else if(page==="Голосовой чат"){
  app.innerHTML=`<section class="robot-area">${robot()}<h2>Голосовой чат</h2><p class="muted">Нажми кнопку и произнеси фразу.</p><button class="primary" id="voice">🎙 Начать голосовой ввод</button><p id="voiceStatus" class="muted"></p><div id="transcript"></div></section>`;
 }
 else {
  app.innerHTML=`<h2>${esc(page)}</h2><section class="card"><p class="muted">Выбери файл для просмотра. Генерация и редактирование ИИ требуют подключения специальных сервисов.</p><input id="media" type="file" accept="image/*,video/*"><div id="mediaPreview"></div></section>`;
 }
}
function newChat(){activeChat=null;go("Новый чат")}
$("#menuBtn").onclick=()=>openMenu($("#menu").classList.contains("hidden"));
$("#shade").onclick=()=>openMenu(false);
$("#settingsBtn").onclick=()=>go("Настройки Роби");
$("#menu").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)go(b.dataset.page)});

$("#app").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="newChat")return newChat();
 if(b.dataset.color){glow=b.dataset.color;localStorage.setItem("robi.glow",glow);return render()}
 if(b.dataset.toggle){let f=features.find(x=>x.id===+b.dataset.toggle);if(f)f.on=!f.on;persist();return render()}
 if(b.dataset.del){features=features.filter(x=>x.id!==+b.dataset.del);persist();return render()}
 if(b.dataset.edit){editFeature=+b.dataset.edit;render();return}
 if(b.dataset.cmdDel!==undefined){commands.splice(+b.dataset.cmdDel,1);persist();return render()}
 if(b.dataset.open){activeChat=b.dataset.open;return go("Новый чат")}
 if(b.dataset.chatDel){chats=chats.filter(x=>x.id!==b.dataset.chatDel);persist();return render()}
 if(b.dataset.projectDel!==undefined){projects.splice(+b.dataset.projectDel,1);persist();return render()}
 if(b.dataset.siteDel!==undefined){sites.splice(+b.dataset.siteDel,1);persist();return render()}
 if(b.dataset.siteOpen!==undefined){editSite=+b.dataset.siteOpen;$("#code").value=sites[editSite].code||`<h1>${esc(sites[editSite].name)}</h1><p>${esc(sites[editSite].desc)}</p>`;$("#editor").scrollIntoView();return}
 if(b.id==="previewBtn"){const code=$("#code").value;$("#preview").srcdoc=code;if(editSite!==null&&sites[editSite]){sites[editSite].code=code;persist()}return}
 if(b.id==="mic"){try{let s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());$("#status").textContent="Доступ предоставлен."}catch{$("#status").textContent="Доступ не предоставлен."}return}
 if(b.id==="voice"){voiceInput();return}
});
$("#app").addEventListener("submit",async e=>{
 e.preventDefault();
 if(e.target.id==="featureForm"){
  let name=$("#fn").value.trim(),desc=$("#fd").value.trim();
  if(editFeature){let f=features.find(x=>x.id===editFeature);if(f){f.name=name;f.desc=desc}editFeature=null}
  else features.push({id:Date.now(),name,desc,on:true});
  persist();render();
 }
 if(e.target.id==="commandForm"){commands.unshift($("#cmd").value.trim());persist();render()}
 if(e.target.id==="projectForm"){projects.unshift($("#pn").value.trim());persist();render()}
 if(e.target.id==="siteForm"){sites.unshift({name:$("#sn").value.trim(),desc:$("#sd").value.trim(),code:""});editSite=0;persist();render()}
 if(e.target.id==="chatForm"){
  let c=chats.find(x=>x.id===activeChat),text=$("#msg").value.trim();if(!c||!text)return;
  c.messages.push({role:"user",text});
  c.name=c.messages.length===1?text.slice(0,30):c.name;
  persist();render();
 }
});
function voiceInput(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("#voiceStatus").textContent="Распознавание речи не поддерживается этим браузером.";return}
 const r=new SR();r.lang="ru-RU";
 r.onstart=()=>$("#voiceStatus").textContent="Слушаю…";
 r.onresult=e=>{
  const text=e.results[0][0].transcript;
  $("#transcript").textContent="Ты сказал: "+text;
  const orb=$("#orb");orb?.classList.add("speaking");
  if("speechSynthesis"in window){let u=new SpeechSynthesisUtterance("Я услышал: "+text);u.lang="ru-RU";u.onend=()=>orb?.classList.remove("speaking");speechSynthesis.speak(u)}
 };
 r.onerror=()=>$("#voiceStatus").textContent="Не удалось распознать речь.";
 try{r.start()}catch{$("#voiceStatus").textContent="Попробуй ещё раз."}
}
$("#app").addEventListener("change",e=>{
 if(e.target.id==="files")$("#fileStatus").textContent=[...e.target.files].map(f=>f.name).join(", ");
 if(e.target.id==="media"&&e.target.files[0]){
  let f=e.target.files[0],url=URL.createObjectURL(f);
  $("#mediaPreview").innerHTML=f.type.startsWith("image/")?`<img alt="Предпросмотр" src="${url}" style="max-width:100%">`:`<video controls src="${url}" style="max-width:100%"></video>`;
 }
});
render();
</script>
</body>
</html>
